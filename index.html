<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guia de Peças e Manutenção 2D</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-slate-800 p-4 md:p-8 font-sans">

  <!-- CONFIGURAÇÃO DO SEU AFILIADO NO JAVASCRIPT -->
  <script>
    const AFILIADOS_CONFIG = {
      mercadolivre: {
        ativo: true,
        // Seus parâmetros oficiais de Afiliado Mercado Livre
        trackingParams: "matt_tool=60782260&matt_word=antoniocfn12",
        
        gerarLink: function(termoBusca) {
          const urlBase = `https://lista.mercadolivre.com.br/${encodeURIComponent(termoBusca)}`;
          return `${urlBase}?${this.trackingParams}`;
        }
      }
    };

    function registrarCliqueAfiliado(nomePeca, modeloCarro) {
      if (typeof gtag === 'function') {
        gtag('event', 'clique_afiliado_ml', {
          'peca': nomePeca,
          'veiculo': modeloCarro
        });
      }
    }
  </script>

  <!-- LÓGICA DE MONTAGEM DOS CARDS (DESIGN ORIGINAL) -->
  <!-- 
    Exemplo de inserção dentro da sua função carregarZona:
  -->
  <script>
    function gerarCardPeca(peca, modeloCarro) {
      const termoCompleto = `${peca.busca} ${modeloCarro}`;
      
      // 1. Gera o link do Mercado Livre já com seu ID de Afiliado
      const urlML = AFILIADOS_CONFIG.mercadolivre.gerarLink(termoCompleto);
      
      // 2. Link de busca do Tutorial no YouTube
      const urlYouTube = `https://www.youtube.com/results?search_query=${encodeURIComponent('como trocar ' + termoCompleto)}`;

      // Tag de dificuldade (opcional)
      let tagDifHTML = '';
      if (peca.nivel) {
        let cor = 'bg-green-100 text-green-700';
        if (peca.nivel === 'Médio') cor = 'bg-amber-100 text-amber-700';
        if (peca.nivel === 'Avançado') cor = 'bg-red-100 text-red-700';
        tagDifHTML = `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${cor}">${peca.nivel}</span>`;
      }

      // Card com o visual original claro (bg-slate-50, rounded-2xl)
      return `
        <div class="bg-slate-50 border border-slate-200 hover:border-blue-400 p-3.5 rounded-2xl transition group shadow-sm">
          <div class="flex items-center justify-between mb-2">
            <h4 class="font-bold text-slate-900 text-xs group-hover:text-blue-700 transition">${peca.nome}</h4>
            ${tagDifHTML}
          </div>
          <div class="flex gap-2">
            <a href="${urlML}" target="_blank" rel="noopener noreferrer" 
               onclick="registrarCliqueAfiliado('${peca.nome}', '${modeloCarro}')"
               class="flex-1 bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300 text-[11px] py-2 px-2.5 rounded-xl text-center font-bold transition flex items-center justify-center gap-1 shadow-sm">
              🛒 Mercado Livre
            </a>
            <a href="${urlYouTube}" target="_blank" rel="noopener noreferrer" 
               class="flex-1 bg-red-100 hover:bg-red-200 text-red-900 border border-red-300 text-[11px] py-2 px-2.5 rounded-xl text-center font-bold transition flex items-center justify-center gap-1 shadow-sm">
              ▶ Tutorial
            </a>
          </div>
        </div>
      `;
    }
  </script>

</body>
</html>
